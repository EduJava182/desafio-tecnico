spring:
  application:
    name: cooperative-voting-api
  datasource:
    url: jdbc:mysql://localhost:3306/cooperative_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username:
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  sql:
    init:
      mode: always
      platform: all
      schema-locations: classpath:schema.sql

project:
  version: "@project.version@"
  name: "@project.name@"
  description: "@project.description@"