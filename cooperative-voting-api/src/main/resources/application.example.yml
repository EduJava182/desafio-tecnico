spring:
  application:
    name: cooperative-voting-api

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

project:
  version: "@project.version@"
  name: "@project.name@"
  description: "@project.description@"
